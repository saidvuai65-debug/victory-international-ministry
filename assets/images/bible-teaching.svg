<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Evangelism and Bible Teaching Editorial Illustration">
  <defs>
    <radialGradient id="bgNavy" cx="50%" cy="42%" r="68%">
      <stop offset="0%" stop-color="#1b4b9c" />
      <stop offset="55%" stop-color="#0a1d4e" />
      <stop offset="100%" stop-color="#051130" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f2d68a" />
      <stop offset="50%" stop-color="#c99a3b" />
      <stop offset="100%" stop-color="#9e7420" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fffdf7" />
      <stop offset="100%" stop-color="#f4e6c2" />
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#e0b85c" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#e0b85c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Deep Royal Navy Background -->
  <rect width="800" height="600" fill="url(#bgNavy)" />
  <circle cx="400" cy="240" r="240" fill="url(#halo)" />

  <!-- Subtle Geometric Orbit Rings matching Seal -->
  <circle cx="400" cy="245" r="175" fill="none" stroke="#c99a3b" stroke-opacity="0.28" stroke-width="1.5" />
  <circle cx="400" cy="245" r="215" fill="none" stroke="#c7cfde" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="5 7" />

  <!-- Light Rays -->
  <g stroke="#e0b85c" stroke-opacity="0.22" stroke-width="2">
    <line x1="400" y1="80" x2="400" y2="40" />
    <line x1="305" y1="108" x2="275" y2="75" />
    <line x1="495" y1="108" x2="525" y2="75" />
    <line x1="245" y1="175" x2="205" y2="155" />
    <line x1="555" y1="175" x2="595" y2="155" />
  </g>

  <!-- Golden Cross rising from Open Bible -->
  <g fill="url(#goldGrad)">
    <rect x="386" y="102" width="28" height="205" rx="5" />
    <rect x="318" y="162" width="164" height="26" rx="5" />
  </g>
  <rect x="391" y="107" width="18" height="195" rx="3" fill="none" stroke="#fff6dc" stroke-opacity="0.5" stroke-width="1.5" />
  <rect x="323" y="167" width="154" height="16" rx="3" fill="none" stroke="#fff6dc" stroke-opacity="0.5" stroke-width="1.5" />

  <!-- Open Holy Bible -->
  <g transform="translate(0, 12)">
    <!-- Hardcover Gold Spine & Base -->
    <path d="M168 418 Q284 388 400 422 Q516 388 632 418 L644 434 Q518 408 400 440 Q282 408 156 434 Z" fill="url(#goldGrad)" />
    <!-- Left Page -->
    <path d="M180 410 Q290 382 396 414 L396 292 Q292 266 196 292 Z" fill="url(#pageGrad)" stroke="#c99a3b" stroke-width="2" />
    <!-- Right Page -->
    <path d="M620 410 Q510 382 404 414 L404 292 Q508 266 604 292 Z" fill="url(#pageGrad)" stroke="#c99a3b" stroke-width="2" />
    <!-- Center Spine Shadow -->
    <line x1="400" y1="292" x2="400" y2="420" stroke="#9e7420" stroke-width="3" />

    <!-- Subtle Scripture Lines on Left Page -->
    <g stroke="#0a1d4e" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round">
      <line x1="224" y1="318" x2="365" y2="310" />
      <line x1="220" y1="336" x2="368" y2="328" />
      <line x1="216" y1="354" x2="368" y2="346" />
      <line x1="212" y1="372" x2="352" y2="365" />
    </g>

    <!-- Subtle Scripture Lines on Right Page -->
    <g stroke="#0a1d4e" stroke-opacity="0.28" stroke-width="3" stroke-linecap="round">
      <line x1="435" y1="310" x2="576" y2="318" />
      <line x1="432" y1="328" x2="580" y2="336" />
      <line x1="432" y1="346" x2="584" y2="354" />
      <line x1="448" y1="365" x2="588" y2="372" />
    </g>
  </g>

  <!-- Stylized White Dove Silhouette with Olive Branch (echoing Seal) -->
  <g transform="translate(248, 222) scale(0.9)">
    <path d="M65 82 C38 78 16 54 12 25 C28 36 44 45 60 52 C48 34 45 14 52 0 C65 18 76 38 82 54 C94 50 107 52 114 60 C121 66 122 73 116 77 C110 80 103 82 98 88 C94 103 78 113 55 113 C42 113 28 119 18 124 C25 108 38 96 54 90 Z" fill="#ffffff" stroke="#c7cfde" stroke-width="2" />
    <!-- Olive Branch -->
    <path d="M116 68 Q136 58 152 44" fill="none" stroke="#c99a3b" stroke-width="2.5" stroke-linecap="round" />
    <ellipse cx="132" cy="54" rx="7" ry="3.5" transform="rotate(-25 132 54)" fill="#e0b85c" />
    <ellipse cx="144" cy="46" rx="7" ry="3.5" transform="rotate(-35 144 46)" fill="#e0b85c" />
  </g>

  <!-- Editorial Label Footer inside Artwork -->
  <text x="400" y="510" text-anchor="middle" fill="#e0b85c" font-family="Georgia, serif" font-size="22" font-weight="bold" letter-spacing="3">THE WORD OF GOD</text>
  <text x="400" y="538" text-anchor="middle" fill="#c7cfde" font-family="Arial, sans-serif" font-size="13" letter-spacing="4">EVANGELISM • DISCIPLESHIP • SCRIPTURE</text>
</svg>
